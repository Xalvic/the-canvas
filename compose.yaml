name: scribble-local

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: scribble
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use --env-file .env.docker and set POSTGRES_PASSWORD}
      SCRIBBLE_DB_PASSWORD: ${SCRIBBLE_DB_PASSWORD:?Set SCRIBBLE_DB_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # PostgreSQL 18 stores data beneath /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ./docker/postgres/001_create_app_role.sql
        target: /docker-entrypoint-initdb.d/001_create_app_role.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "scribble", "-d", "scribble"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    image: scribble-api:local
    env_file: .env.docker
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      CONTAINER_DATABASE_HOST: postgres
      CONTAINER_DATABASE_PORT: "5432"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  postgres-data:
