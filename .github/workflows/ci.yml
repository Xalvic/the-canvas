name: Validate Scribble
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scribble-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: scribble
          POSTGRES_PASSWORD: fixture-only-not-a-production-secret
          POSTGRES_DB: scribble
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U scribble -d scribble"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI_DATABASE_URL: postgresql://scribble:fixture-only-not-a-production-secret@127.0.0.1:5434/scribble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:validate
      - run: npm run typecheck:server
      - run: npx tsc -p deployment/tsconfig.json
      - run: npm test
      - name: Configure disposable browser fixtures
        run: node -e "require('node:fs').writeFileSync('.env.docker', 'DATABASE_URL=' + process.env.CI_DATABASE_URL + '\n')"
      - run: npm run test:database:docker
      - run: npm run build && npm run build:server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:integration
      - run: docker build --tag scribble-api:local .
      - run: node scripts/docker-persistence-proof.mjs
      - run: docker build --file docker/backups/Dockerfile --tag scribble-backups:local .
      - run: node scripts/backup-restore-proof.mjs
      - run: node scripts/proxy-log-proof.mjs
      - name: Retain local build artifacts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scribble-build-${{ github.sha }}
          path: |
            dist/
            dist-server/
          retention-days: 7
# No publishing or deployment occurs here. Release automation requires a
# reviewed host/registry and protected deployment environment before enabling it.
